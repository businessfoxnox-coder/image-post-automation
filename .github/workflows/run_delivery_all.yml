name: Scheduled Delivery Post Generator

on:
  schedule:
    # 12:00 PM UTC = 05:30 PM IST (Monday through Friday)
    - cron: '2 12 * * 1-5'
  workflow_dispatch: # Manual run trigger

permissions:
  contents: write # Allows committing generated images back to repo

jobs:
  run-delivery-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pillow matplotlib requests

      - name: Execute Delivery Script
        run: |
          python DELIVERY.py

      - name: Commit and Push Generated Post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DELIVERY/
          git commit -m "Auto-generate Delivery post [skip ci]" || echo "No changes to commit"
          git push
