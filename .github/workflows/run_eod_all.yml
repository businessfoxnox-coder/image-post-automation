name: Scheduled EOD Post Generator

on:
  schedule:
    # 10:10 AM UTC = 03:40 PM IST (Monday through Friday)
    - cron: '10 10 * * 1-5'
  workflow_dispatch: # Enables manual run button from GitHub Actions UI

permissions:
  contents: write # Allows workflow to commit generated EOD posts back to the repo

jobs:
  run-eod-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pillow matplotlib requests numpy

      - name: Execute EOD Script
        run: |
          python EOD_ALL.py

      - name: Commit and Push Generated Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add EOD_POSTS/ EOD_SLIDES/
          git commit -m "Auto-generate EOD posts [skip ci]" || echo "No changes to commit"
          git push
