name: Scheduled Image Generator

on:
  schedule:
    # Runs Monday to Friday at 02:20 UTC (Which is 07:50 AM IST)
    - cron: '10 2 * * 1-5'
  workflow_dispatch: # Enables manual trigger button from GitHub UI

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter pandas pillow matplotlib google-api-python-client google-auth

      - name: Execute Notebook
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          papermill TEMPLATES.ipynb output_executed.ipynb
