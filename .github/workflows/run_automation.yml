name: Template Generator

on:
  schedule:
    - cron: '22 2 * * 1-5' # 07:50 AM IST (Mon-Fri)
  workflow_dispatch:

permissions:
  contents: write # Allows workflow to commit generated images back to repo

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pillow matplotlib

      - name: Execute Script
        run: |
          python TEMPLATES.py

      - name: Commit and Push Generated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_templates/
          git commit -m "Auto-generate post templates [skip ci]" || echo "No changes to commit"
          git push
